<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/gesschool-192.png" />
    <link rel="apple-touch-icon" href="/gesschool-180.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0B1F3A" />
    <title>GesSchool — Gestion scolaire</title>
    <!-- Polices de l'identité visuelle -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>

    <!-- Écran d'ouverture (produit-first, signature GesPro) — pur CSS, se retire seul. -->
    <div id="gs-splash" aria-hidden="true">
      <div class="gs-splash-in">
        <svg viewBox="0 0 100 100" width="88" height="88" aria-hidden="true">
          <!-- La plume (même dessin que src/composants/Logo.jsx). -->
          <path d="M80 10 C52 16 32 40 28 72 L33 76 C58 62 76 42 80 10 Z" fill="#C9A227" />
          <path d="M74 18 C58 32 44 50 31 73" stroke="#0B1F3A" stroke-width="2.4" fill="none" stroke-linecap="round" />
          <path d="M30 74 L20 90" stroke="#C9A227" stroke-width="4" stroke-linecap="round" />
          <path d="M18 92 H60" stroke="#C9A227" stroke-width="3" stroke-linecap="round" opacity=".55" />
        </svg>
        <div class="gs-name">Ges<span>School</span></div>
        <div class="gs-tag">L'école connectée, la gestion simplifiée</div>
      </div>
      <div class="gs-by">une solution <b>GesPro Digitals</b></div>
    </div>
    <style>
      #gs-splash{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0B1F3A;color:#F7F5EF;font-family:Inter,system-ui,sans-serif;animation:gsOut .5s ease 1s forwards}
      #gs-splash .gs-splash-in{display:flex;flex-direction:column;align-items:center;gap:12px;animation:gsRise .6s cubic-bezier(.2,.7,.3,1) both}
      #gs-splash svg{filter:drop-shadow(0 8px 22px rgba(0,0,0,.35));animation:gsPop .7s cubic-bezier(.2,.8,.2,1) both}
      #gs-splash .gs-name{font-family:'Space Grotesk',Inter,system-ui,sans-serif;font-weight:700;font-size:30px;letter-spacing:-.01em}
      #gs-splash .gs-name span{color:#C9A227}
      #gs-splash .gs-tag{font-size:13px;color:rgba(247,245,239,.55)}
      #gs-splash .gs-by{position:absolute;bottom:34px;font-size:12px;color:rgba(247,245,239,.45)}
      #gs-splash .gs-by b{color:rgba(247,245,239,.82);font-weight:600}
      @keyframes gsOut{to{opacity:0;visibility:hidden}}
      @keyframes gsRise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
      @keyframes gsPop{from{opacity:0;transform:scale(.82)}to{opacity:1;transform:none}}
      @media (prefers-reduced-motion:reduce){#gs-splash,#gs-splash .gs-splash-in,#gs-splash svg{animation:gsOut .3s ease .9s forwards}}
    </style>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
